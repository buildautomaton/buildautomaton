name: Publish packages

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @buildautomaton/runtime --filter @buildautomaton/plugins --filter @buildautomaton/ui-runtime --filter @buildautomaton/product-director --filter @buildautomaton/marketplace --filter @buildautomaton/local-cli build
      - run: pnpm publish:packages --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
